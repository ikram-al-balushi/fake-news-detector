<!DOCTYPE html>
<html>
<head>
    <title>Fake News Detector</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        textarea { width: 100%; height: 150px; padding: 10px; font-size: 16px; }

        button { margin-top: 10px; padding: 12px 24px; font-size: 16px; cursor: pointer; }

        #result { margin-top: 20px; font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>
    <!-- yhan se agy claude code likh ke banaya hai, ye code fake news detect karne ke liye hai. -->
    <h1>Fake News Detector</h1>
    <textarea id="newsText" placeholder="Yahan news paste karo..."></textarea>
    <button onclick="checkNews()">Check News</button>
    <div id="result"></div>

    <script>
        async function checkNews() {
            const text = document.getElementById("newsText").value;
            const res = await fetch("/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text: text })
            });
            const data = await res.json();
            document.getElementById("result").innerText = "Result: " + data.result;
        }
    </script>
</body>
</html>
